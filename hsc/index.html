<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oxford House HSC Visits</title>
<meta name="robots" content="noindex">
<meta name="description" content="The HSC visit tracker is temporarily offline for updates.">
<meta name="theme-color" content="#1B5FA6">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  :root{--ink:#F1F6F8;--muted:#9FB3C4;--line:#20405E;--bg:#0A1A2B;--card:#10273D;--mint:#4CD39A}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  header{background:linear-gradient(135deg,#1B5FA6,#1E8C6E);padding:28px 16px;text-align:center;border-radius:0 0 24px 24px}
  header h1{margin:0;font-size:30px;letter-spacing:2px}
  header .sub{color:#DFF7EC;font-size:14px;letter-spacing:4px;margin-top:4px}
  main{max-width:520px;margin:0 auto;padding:24px 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  .card h2{margin:0 0 8px;font-size:22px;color:var(--mint)}
  .card p{margin:0}
</style>
</head>
<body>
<header><h1>OXFORD HOUSE</h1><div class="sub">HSC VISITS</div></header>
<main>
  <div class="card">
    <h2>Temporarily Offline for Updates</h2>
    <p>We're making some updates. Check back soon.</p>
  </div>
</main>
<script>
// Clear the old saved copy of the hub from phones that installed it.
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
if ('caches' in window) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
</script>
</body>
</html>
