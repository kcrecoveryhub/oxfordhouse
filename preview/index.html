<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oxford House Hub</title>
<meta name="theme-color" content="#1B5FA6">
<meta name="description" content="Reference and announcements for Oxford House Chapter 2 and Chapter 9">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OH Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Archivo:wght@700;800;900&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1A2B; --panel:#10273D; --panel2:#16334F; --navy:#14467A; --ink:#F1F6F8; --muted:#9FB3C4;
  --sky:linear-gradient(160deg,#1B5FA6 0%,#167C8E 55%,#1E9C6C 100%); --mint:#8EF0C2; --warm:#F5C451;
  --gold:#4CD39A; --gold2:#2FB37E; --line:#20405E; --dark:#062033;
  --alert:#E5484D; --alert-tint:#3A1820; --alert-line:#6B2A36;
  --teal:var(--gold); --white:var(--panel); --tint:var(--panel2);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; font-size:18px; line-height:1.5; padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--gold)}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px; border-radius:6px}
.wrap{max-width:640px; margin:0 auto; padding:0 16px 40px}
h1,h2,h3,.disp{font-family:'Archivo',sans-serif}

/* section top bar */
.bar{position:sticky; top:0; z-index:5; background:var(--sky); padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 18px; border-radius:0 0 24px 24px}
.bar-in{max-width:640px; margin:0 auto; display:flex; flex-direction:column; align-items:flex-start; gap:10px}
.back{display:inline-flex; align-items:center; gap:4px; min-height:44px; padding:0 14px 0 8px; background:rgba(255,255,255,.08); color:var(--mint); border-radius:14px; font-weight:700; font-size:17px; text-decoration:none}
.back svg{width:22px; height:22px}
.bar h1{margin:0; font-size:28px; line-height:1.1; font-weight:900; color:#fff}
.bar .kick{font-size:12px; letter-spacing:.14em; font-weight:700; color:var(--mint); text-transform:uppercase; font-family:'Archivo',sans-serif; margin-bottom:-6px}

/* hub header */
.hero{background:var(--sky); text-align:center; padding:calc(env(safe-area-inset-top,0px) + 26px) 16px 104px; border-radius:0 0 30px 30px}
.lg-a{font-family:'Archivo',sans-serif; font-weight:900; font-size:30px; letter-spacing:.06em; line-height:1; color:#fff}
.lg-b{display:flex; align-items:center; gap:12px; justify-content:center; margin-top:7px; color:var(--mint); font-family:'Archivo',sans-serif; font-weight:800; font-size:16px; letter-spacing:.5em; padding-left:.5em}
.lg-b:before,.lg-b:after{content:""; height:2px; width:60px; background:var(--mint)}
.chap{font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#CFE6EE; margin-top:10px; font-family:'Archivo',sans-serif}
.wh{font-family:'Kaushan Script',cursive; color:var(--warm); font-size:48px; line-height:1.1; margin-top:10px; text-shadow:0 3px 0 rgba(0,0,0,.28)}
.wh-mark{display:block; width:230px; height:26px; margin:2px auto 0; fill:none; stroke:var(--warm); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.wh-mark .roof{fill:var(--warm)} .wh-mark .door{stroke:#167C8E; stroke-width:2}
.meet{display:block; text-decoration:none; position:relative; margin:-70px 16px 0; border-radius:22px; padding:18px; background:linear-gradient(135deg,#1B5FA6,#12704F); border:1px solid rgba(255,255,255,.22); color:#fff; box-shadow:0 12px 28px rgba(0,0,0,.35)}
.meet small{font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:12px; font-family:'Archivo',sans-serif}
.meet .d{font-family:'Archivo',sans-serif; font-weight:900; font-size:42px; line-height:1; margin:4px 0 4px}
.meet .l{font-weight:700; font-size:17px; line-height:1.3}
.meet .w{font-size:14px; margin-top:2px}
.meet-go{display:block; color:inherit; text-decoration:none}
.cal-btns{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.cta{display:inline-flex; align-items:center; gap:6px; min-height:46px; border:0; cursor:pointer; font:inherit; background:#fff; color:#0E3F6B; border-radius:12px; padding:0 14px; font-weight:700; font-size:15px}
.hub-body{max-width:640px; margin:0 auto; padding:14px 16px 40px}
.tile{display:flex; text-decoration:none; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:20px}
.tile svg{flex:none; stroke:var(--gold)}
.tile .t{font-weight:700; line-height:1.2}
.tile .s{color:var(--muted); font-size:14px; line-height:1.3}
.wide{background:var(--panel2); padding:16px; gap:14px; align-items:center; min-height:78px}
.wide svg{width:32px; height:32px}
.wide .t{font-size:18px}
.hub-h{font-family:'Archivo',sans-serif; font-size:21px; font-weight:800; margin:24px 0 12px}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid .tile{flex-direction:column; justify-content:space-between; gap:12px; padding:16px; min-height:112px}
.grid .tile svg{width:30px; height:30px}
.grid .t{font-size:17px}
.mini{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.mini .tile{align-items:center; gap:10px; padding:12px 14px; min-height:58px; font-size:16px}
.mini .tile svg{width:22px; height:22px}

/* HSC tracker card on the front page */
.hsc{display:block; text-decoration:none; color:var(--ink); margin-top:12px}
.hsc .k{font-family:'Archivo',sans-serif; font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--gold)}
.hsc .h{font-family:'Archivo',sans-serif; font-size:21px; font-weight:900; line-height:1.15; margin-top:2px}
.hsc .s{color:var(--muted); font-size:14px; margin-top:2px}
.hsc .go{display:inline-flex; align-items:center; gap:6px; margin-top:12px; background:var(--gold); color:var(--dark); border-radius:12px; padding:10px 14px; font-weight:700; font-size:15px}
.hsc-c{position:relative; background:linear-gradient(180deg,var(--panel2),var(--panel)); border:2px solid var(--gold); border-radius:20px; padding:26px 16px 16px; margin-top:24px}
.hsc-c .clip{position:absolute; top:-14px; left:50%; transform:translateX(-50%); background:var(--gold); color:var(--dark); border-radius:10px; padding:4px 14px; font-family:'Archivo',sans-serif; font-weight:900; font-size:12px; letter-spacing:.14em}
.hsc-c .row{display:flex; justify-content:space-between; align-items:flex-end; gap:12px}
.hsc-c .ring{flex:none; width:84px; height:84px; position:relative}
.hsc-c .ring svg{width:84px; height:84px; transform:rotate(-90deg)}
.hsc-c .ring b{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'Archivo',sans-serif; font-weight:900; font-size:26px; line-height:1; color:var(--gold)}
.hsc-c .ring b small{font-size:9px; letter-spacing:.08em; color:var(--muted); font-weight:700; margin-top:3px}
.hsc-c .row{align-items:center}
.hsc-c .days{font-family:'Archivo',sans-serif; font-weight:900; font-size:40px; line-height:1; color:var(--gold); text-align:right}
.hsc-c .days small{display:block; font-size:11px; letter-spacing:.08em; color:var(--muted); font-weight:700}
.hsc-c .go{display:flex; justify-content:center}
/* Practice the Traditions: front-page card and games */
.prc{position:relative; display:block; overflow:hidden; text-decoration:none; color:#fff; margin-bottom:12px; border-radius:22px; padding:18px 16px 16px; background:linear-gradient(135deg,#1B5FA6 0%,#167C8E 55%,#12704F 100%); border:2px solid var(--mint); box-shadow:0 10px 24px rgba(0,0,0,.3)}
.prc .k{display:inline-block; background:var(--mint); color:var(--dark); border-radius:99px; padding:3px 10px; font-family:'Archivo',sans-serif; font-weight:900; font-size:11px; letter-spacing:.14em}
.prc .h{font-family:'Archivo',sans-serif; font-weight:900; font-size:24px; line-height:1.1; margin-top:10px; max-width:62%}
.prc .s{font-size:15px; color:#DCEEF3; margin-top:4px; max-width:62%}
.prc .modes{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; max-width:68%}
.prc .modes span{background:rgba(255,255,255,.14); border-radius:99px; padding:3px 10px; font-size:13px; font-weight:700}
.prc .go{display:flex; justify-content:center; margin-top:14px; background:var(--mint); color:var(--dark); border-radius:12px; padding:12px 14px; font-weight:800; font-size:16px}
.prc .fan{position:absolute; right:14px; top:22px; width:110px; height:120px}
.prc .fan i{position:absolute; left:28px; top:6px; width:62px; height:86px; border-radius:10px; background:#F3F7F8; color:#0E3F6B; display:flex; align-items:center; justify-content:center; font-style:normal; font-family:'Archivo',sans-serif; font-weight:900; font-size:30px; box-shadow:0 6px 14px rgba(0,0,0,.3); border:2px solid #fff}
.prc .fan i:nth-child(1){transform:rotate(-16deg) translateX(-22px); background:#CFE6EE}
.prc .fan i:nth-child(2){transform:rotate(-2deg) translateY(-4px); background:#E2F3EC}
.prc .fan i:nth-child(3){transform:rotate(13deg) translateX(22px); background:var(--warm); color:#3A2A05}
.pr-tabs{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:5px; margin-top:16px}
.pr-tab{min-height:46px; border:0; border-radius:12px; background:transparent; color:var(--ink); font:inherit; font-weight:700; font-size:16px; cursor:pointer}
.pr-tab.on{background:var(--gold); color:var(--dark)}
.fc{display:flex; flex-direction:column; justify-content:center; align-items:center; gap:12px; width:100%; min-height:270px; margin-top:12px; padding:24px 20px; border-radius:22px; border:2px solid var(--mint); background:linear-gradient(160deg,#1B5FA6,#12704F); color:#fff; font:inherit; text-align:center; cursor:pointer}
.fc.on{background:var(--panel2); border-color:var(--gold)}
.fc-k{font-family:'Archivo',sans-serif; font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--mint)}
.fc-t{font-family:'Archivo',sans-serif; font-weight:900; font-size:34px; line-height:1.15}
.fc.on .fc-t{font-family:'Atkinson Hyperlegible',sans-serif; font-weight:400; font-size:21px; line-height:1.45}
.pr-nav{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px}
.pr-nav button{cursor:pointer; font:inherit; font-weight:700}
.pr-nav .pr-ok,.pr-nav .pr-no{margin:0}
.pr-link{display:block; margin:10px auto 0; min-height:44px; background:none; border:0; color:var(--gold); font:inherit; font-weight:700; text-decoration:underline; cursor:pointer}
.pr-k{font-family:'Archivo',sans-serif; font-size:13px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--gold)}
.pr-hint{color:var(--muted); font-size:15px; margin:4px 0 10px}
/* Spot the Change */
.stc-line{font-size:19px; line-height:1.5; margin:10px 0 0}
.stc-w{display:inline; padding:2px 4px; border-radius:6px; border:1.5px solid transparent; cursor:pointer; transition:border-color .15s}
.stc-w:hover,.stc-w:focus{border-color:var(--gold)}
.stc-w.pick{background:var(--alert-tint); border-color:var(--alert); color:#FF8A8E; font-weight:700}
.stc-w.right{background:rgba(76,211,154,.15); border-color:var(--gold); color:var(--gold); font-weight:700}
.stc-w.hint{border-color:var(--gold); border-style:dashed}
.stc-correct{text-decoration:line-through; opacity:.55}
/* Lightning Round */
.lr-clock{font-family:'Archivo',sans-serif; font-weight:900; font-size:42px; color:var(--gold); text-align:center; line-height:1}
.lr-trad{font-family:'Archivo',sans-serif; font-weight:800; font-size:14px; letter-spacing:.1em; text-transform:uppercase; color:var(--mint); margin-top:14px}
.lr-text{font-size:19px; line-height:1.45; margin:8px 0 0}
.lr-btns{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px}
.lr-btns button{min-height:56px; border-radius:14px; border:2px solid var(--line); background:var(--panel); color:var(--ink); font:inherit; font-weight:800; font-size:18px; cursor:pointer}
.lr-btns button.yes{border-color:var(--gold); color:var(--gold)}
.lr-btns button.no{border-color:var(--alert); color:#FF8A8E}
.lr-btns button:disabled{opacity:.5; cursor:default}
.lr-btns button.pick-right{background:var(--gold); color:var(--dark); border-color:var(--gold)}
.lr-btns button.pick-wrong{background:var(--alert); color:#fff; border-color:var(--alert)}
.lr-streak{display:flex; gap:4px; justify-content:center; margin-top:10px; flex-wrap:wrap}
.lr-dot{width:14px; height:14px; border-radius:50%; background:var(--panel2); border:1px solid var(--line)}
.lr-dot.right{background:var(--gold); border-color:var(--gold)}
.lr-dot.wrong{background:var(--alert); border-color:var(--alert)}
.pr-ok{color:var(--gold); font-weight:700; margin:10px 0 0}
.pr-no{color:#FF8A8E; font-weight:700; margin:10px 0 0}
.pr-prog{margin-top:16px; color:var(--muted); font-weight:700; font-size:15px}
.pr-q{font-size:20px; line-height:1.45; margin:8px 0 0}
.mt-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px}
.mt{min-height:64px; border-radius:16px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-family:'Archivo',sans-serif; font-weight:900; font-size:26px; cursor:pointer}
.mt.right{background:var(--gold); color:var(--dark); border-color:var(--gold)}
.mt.wrong{background:var(--alert); color:#fff; border-color:var(--alert)}
.mt:disabled{cursor:default}
.mt:disabled:not(.right):not(.wrong){opacity:.45}
.pr-done{text-align:center}
.pr-big{font-family:'Archivo',sans-serif; font-weight:900; font-size:56px; color:var(--gold); line-height:1.1; margin-top:6px}
.pr-foot{color:var(--muted); font-size:14px; margin-top:24px; text-align:center}
.helpbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:14px; background:var(--alert-tint); border:1px solid var(--alert-line); border-radius:20px; padding:14px 16px; text-decoration:none; color:var(--ink)}
.helpbar b{font-size:17px}
.helpbar span{background:var(--alert); color:#fff; border-radius:12px; padding:10px 14px; font-weight:700; white-space:nowrap}
.install{font-size:14px; line-height:1.4; color:var(--muted); text-align:center; padding:24px 8px 0}
.install p{margin:0 0 4px}

/* cards */
.group-title{font-size:20px; font-weight:800; margin:26px 0 6px; line-height:1.2}
.group-note{margin:14px 0 10px; color:var(--muted); font-size:16px}
details.card{background:var(--panel); border:1px solid var(--line); border-radius:18px; margin-top:10px}
details.card summary{list-style:none; cursor:pointer; min-height:62px; padding:14px 16px; font-weight:700; font-size:18px; line-height:1.25; display:flex; align-items:center; justify-content:space-between; gap:12px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:""; flex:none; width:11px; height:11px; border-right:3px solid var(--gold); border-bottom:3px solid var(--gold); transform:rotate(45deg); margin-top:-4px; transition:transform .15s ease}
details.card[open] summary::after{transform:rotate(-135deg); margin-top:4px}
details.card[open]{border:2px solid var(--gold); background:var(--panel2)}
.cb{padding:2px 16px 16px}
.cb p{margin:0 0 12px}
.cb ul,.cb ol{margin:0 0 12px; padding-left:24px}
.cb li{margin-bottom:6px}
.cb li::marker{color:var(--gold)}
.cb p.quote{font-size:20px; line-height:1.45; border-left:4px solid var(--gold); padding-left:14px; color:#fff}
.meta{border-top:1px solid var(--line); margin-top:14px; padding-top:10px; color:var(--muted); font-size:13px; line-height:1.4}
.meta div+div{margin-top:2px}

.block{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:16px; margin-top:10px}
.block h3{margin:0 0 2px; font-size:19px; line-height:1.25}
.block .when{font-size:17px; margin:6px 0 0}
.block .where{color:var(--muted); font-size:16px; margin:4px 0 0}
.next-card{background:linear-gradient(135deg,#1B5FA6,#12704F); border:0; color:#fff}
.next-card .where,.next-card .when,.next-card .meta{color:#E8FFF4!important}
.next-card .meta{border-color:rgba(0,0,0,.15)}
.next-card .date{font-family:'Archivo',sans-serif; font-size:28px; font-weight:900; line-height:1.1; margin:4px 0 0; color:#fff}
.empty{background:transparent; border:2px dashed var(--line); border-radius:18px; padding:16px; margin-top:10px; color:var(--muted)}

.linkrow{display:block; text-decoration:none; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:14px 16px; margin-top:10px; min-height:60px}
.linkrow b{display:block; font-size:18px; color:var(--gold)}
.linkrow span{display:block; color:var(--muted); font-size:15px; line-height:1.4; margin-top:2px}
.res{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:14px 16px; margin-top:10px}
.res h3{margin:0; font-size:18px; line-height:1.25}
.res p{margin:4px 0 10px; color:var(--muted); font-size:15px; line-height:1.4}
.btns{display:flex; flex-wrap:wrap; gap:8px}
.btn{display:inline-flex; align-items:center; min-height:48px; padding:0 18px; border-radius:14px; font-weight:700; font-size:17px; text-decoration:none; border:2px solid var(--gold); color:var(--gold); background:transparent}
.btn.call{background:var(--gold); color:var(--dark)}
.badge{display:inline-block; margin-top:4px; padding:2px 10px; border-radius:99px; background:#123A33; color:var(--gold); font-size:13px; font-weight:700}
.res.emergency{background:var(--alert-tint); border-color:var(--alert-line)}
.res.emergency .btn.call{background:var(--alert); border-color:var(--alert); color:#fff}
.res.emergency h3{color:#FF8A8E}

.search{width:100%; min-height:54px; font:inherit; font-size:18px; padding:0 16px; border:2px solid var(--line); border-radius:16px; background:var(--panel); color:var(--ink); margin-top:16px}
.search::placeholder{color:var(--muted)}
.term{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:12px 16px; margin-top:10px}
.term b{display:block; font-size:18px; color:var(--gold); font-family:'Archivo',sans-serif}
.term p{margin:2px 0 0}
.term .meta{margin-top:8px; padding-top:8px}
.house{display:flex; justify-content:space-between; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:12px 16px; margin-top:10px}
.house b{font-size:18px; display:block}
.house span{color:var(--muted); font-size:15px}
.house .r{text-align:right; flex:none; max-width:45%}
.soon{text-align:center; padding:28px 16px; background:var(--panel); border:1px solid var(--line); border-radius:20px; margin-top:18px}
.soon svg{width:56px; height:56px; stroke:var(--gold)}
.soon h3{font-size:22px; margin:10px 0 4px}
.soon p{color:var(--muted); margin:0}
.btn.big{display:flex; justify-content:center; width:100%; min-height:58px; margin-top:18px; font-size:19px}
.mini .tile:last-child:nth-child(odd){grid-column:span 2}
.status{font-size:13px; color:var(--muted); text-align:center; margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:340px){.grid,.mini{grid-template-columns:1fr}}
</style>

</head>
<body>
<div id="app"></div>

<script>
/* ============ SETTINGS (the only thing to edit in this file) ============
   Paste the Sheet's ID between the quotes. It is the long code in the Sheet's web address:
   https://docs.google.com/spreadsheets/d/  THIS-PART  /edit
   Leave it as is and the app shows the content saved inside the app (content.json). */
const SHEET_ID = '1-vzKu8RlqYbu5tGH0kZD3__KnuM8W63xNfgxqmWLQTY';
/* ====================================================================== */

const TABS = ['Announcements','NewMember','Traditions','Positions','Meetings','ChapterCards','Glossary','FormsLinks','ChapterInfo','Houses','LocalResources'];
const LIVE = SHEET_ID && SHEET_ID !== 'PASTE_SHEET_ID_HERE';
const KEY = 'ohub.data.v1'; /* same saved copy as the main hub */
let DATA = {};
let STATUS = {};

/* ---------- small helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rows = t => (DATA[t] || []);
const val = (o, k) => (o && o[k] != null ? String(o[k]).trim() : '');
const num = v => { const n = parseFloat(v); return isNaN(n) ? 1e9 : n; };

function parseCSV(text){
  const out = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n'){ row.push(f); out.push(row); row = []; f = ''; }
    else if (c === '\r'){ /* skip */ }
    else f += c;
  }
  if (f.length || row.length){ row.push(f); out.push(row); }
  return out;
}
function toObjects(grid){
  if (!grid.length) return [];
  const h = grid[0].map(x => x.trim());
  return grid.slice(1).filter(r => r.some(x => x.trim() !== '')).map(r => {
    const o = {}; h.forEach((k, i) => { o[k] = r[i] != null ? r[i] : ''; }); return o;
  });
}

/* ---------- text body: paragraphs, bullets, numbered lists ---------- */
function body(text){
  const lines = String(text || '').split('\n');
  let html = '', para = [], list = null, items = [];
  const flushP = () => {
    if (para.length){
      const t = para.join(' ').trim();
      html += '<p' + (/^["\u201C]/.test(t) ? ' class="quote"' : '') + '>' + esc(t) + '</p>';
      para = [];
    }
  };
  const flushL = () => { if (list){ html += '<' + list + '>' + items.map(i => '<li>' + esc(i) + '</li>').join('') + '</' + list + '>'; list = null; items = []; } };
  for (const raw of lines){
    const ln = raw.trim();
    let m;
    if (!ln){ flushP(); flushL(); }
    else if ((m = /^[-\u2022]\s+(.*)$/.exec(ln))){ flushP(); if (list !== 'ul'){ flushL(); list = 'ul'; } items.push(m[1]); }
    else if ((m = /^\d+\.\s+(.*)$/.exec(ln))){ flushP(); if (list !== 'ol'){ flushL(); list = 'ol'; } items.push(m[1]); }
    else { flushL(); para.push(ln); }
  }
  flushP(); flushL();
  return html;
}
function meta(src, lr){
  if (!src && !lr) return '';
  return '<div class="meta">' + (src ? '<div>Source: ' + esc(src) + '</div>' : '') + (lr ? '<div>Last reviewed: ' + esc(lr) + '</div>' : '') + '</div>';
}
function card(title, bodyText, src, lr){
  return '<details class="card"><summary>' + esc(title) + '</summary><div class="cb">' + body(bodyText) + meta(src, lr) + '</div></details>';
}
function cards(tab, titleKey, bodyKey){
  return rows(tab).slice().sort((a, b) => num(a.Order) - num(b.Order))
    .map(r => card(val(r, titleKey), val(r, bodyKey), val(r, 'Source'), val(r, 'LastReviewed'))).join('');
}

/* ---------- dates: "First Monday", "Fourth Saturday" ---------- */
const DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const ORD = {first:1, second:2, third:3, fourth:4, fifth:5, last:-1};
function parseRule(t){
  const m = /\b(first|second|third|fourth|fifth|last)\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i.exec(t || '');
  return m ? {n: ORD[m[1].toLowerCase()], d: DAYS.indexOf(m[2].toLowerCase())} : null;
}
function nthDay(y, mo, n, d){
  if (n > 0){
    const first = new Date(y, mo, 1), off = (d - first.getDay() + 7) % 7;
    const dt = new Date(y, mo, 1 + off + (n - 1) * 7);
    return dt.getMonth() === mo ? dt : null;
  }
  const last = new Date(y, mo + 1, 0), off = (last.getDay() - d + 7) % 7;
  return new Date(y, mo, last.getDate() - off);
}
function nextDate(rule, from){
  const t = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  for (let i = 0; i < 14; i++){
    const dt = nthDay(t.getFullYear(), t.getMonth() + i, rule.n, rule.d);
    if (dt && dt >= t) return dt;
  }
  return null;
}
function dayLabel(dt, now){
  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((dt - t0) / 86400000);
  const base = dt.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
  return diff === 0 ? 'Today, ' + base : diff === 1 ? 'Tomorrow, ' + base : base;
}
function meetings(){
  const now = new Date();
  return rows('ChapterInfo').map(r => {
    const rule = parseRule(val(r, 'WhenText'));
    const dt = rule ? nextDate(rule, now) : null;
    const chapter = val(r, 'Chapter'), kind = val(r, 'Meeting');
    const title = /^interchapter$/i.test(chapter) ? kind : (chapter + ' ' + kind.toLowerCase()).trim();
    const when = val(r, 'WhenText'); const i = when.indexOf('. ');
    return {r, dt, title, times: i >= 0 ? when.slice(i + 2) : '', rule: i >= 0 ? when.slice(0, i) : when};
  }).sort((a, b) => (a.dt && b.dt) ? a.dt - b.dt : a.dt ? -1 : 1);
}

/* ---------- add to calendar (.ics file) ---------- */
const pad = n => String(n).padStart(2, '0');
// When we want people there: food & fellowship if listed, else the first time given.
function foodTime(s){ const f = /food and fellowship ([0-9]{1,2}:[0-9]{2} ?[ap]\.m\.)/i.exec(s || '') || /[0-9]{1,2}:[0-9]{2} ?[ap]\.m\./i.exec(s || ''); return f ? f[1] || f[0] : ''; }
function clock(t){
  const m = /(\d{1,2}):(\d{2})\s*([ap])\.?m/i.exec(t || ''); if (!m) return null;
  let h = parseInt(m[1], 10) % 12; if (m[3].toLowerCase() === 'p') h += 12;
  return h * 60 + parseInt(m[2], 10);
}
function icsStamp(dt, mins){ return dt.getFullYear() + pad(dt.getMonth() + 1) + pad(dt.getDate()) + 'T' + pad(Math.floor(mins / 60)) + pad(mins % 60) + '00'; }
const icsText = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
function addToCalendar(i){
  const m = meetings().filter(x => x.dt)[i]; if (!m) return;
  const start = clock(foodTime(m.times)), biz = clock((/business ([^,]+)/i.exec(m.times) || [])[1]);
  const end = biz != null ? biz + 60 : (start != null ? start + 120 : null);
  const now = new Date(), stamp = now.getUTCFullYear() + pad(now.getUTCMonth() + 1) + pad(now.getUTCDate()) + 'T' + pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + '00Z';
  const d = m.dt, day = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  const when = start != null
    ? ['DTSTART;TZID=America/Chicago:' + icsStamp(d, start), 'DTEND;TZID=America/Chicago:' + icsStamp(d, end)]
    : ['DTSTART;VALUE=DATE:' + day];
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Oxford House Hub//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VTIMEZONE','TZID:America/Chicago',
    'BEGIN:DAYLIGHT','TZOFFSETFROM:-0600','TZOFFSETTO:-0500','TZNAME:CDT','DTSTART:19700308T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU','END:DAYLIGHT',
    'BEGIN:STANDARD','TZOFFSETFROM:-0500','TZOFFSETTO:-0600','TZNAME:CST','DTSTART:19701101T020000','RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU','END:STANDARD',
    'END:VTIMEZONE',
    'BEGIN:VEVENT','UID:' + day + '-' + m.title.replace(/\W+/g, '-').toLowerCase() + '@oxfordhouse-hub','DTSTAMP:' + stamp].concat(when, [
    'SUMMARY:' + icsText('Oxford House ' + m.title),
    'LOCATION:' + icsText(val(m.r, 'Where')),
    'DESCRIPTION:' + icsText(val(m.r, 'WhenText')),
    'END:VEVENT','END:VCALENDAR']);
  const blob = new Blob([lines.join('\r\n') + '\r\n'], {type:'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = m.title.replace(/\W+/g, '-').toLowerCase() + '.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const short = t => t.replace(/ chapter meeting$/i, '');
const CAL_ICON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>';
function calButtons(list, all){

/* ---------- Practice the Traditions ---------- */
// Traditions practiced in the manual's full wording, because the short form drops a key idea.
const PRACTICE_FULL = ['Tradition Eight'];
function tradList(){
  return rows('Traditions').filter(r => /^Tradition /i.test(val(r, 'Card'))).sort((a, b) => num(a.Order) - num(b.Order)).map(r => {
    const b = val(r, 'Body'), full = PRACTICE_FULL.includes(val(r, 'Card'));
    const s = (!full && /Short form:\s*"([^"]+)"/i.exec(b)) || /"([^"]+)"/.exec(b);
    return {name: val(r, 'Card'), text: s ? s[1].trim() : b.split('\n')[0]};
  });
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const PR = {mode:'flip', i:0, flip:false, deck:null, mt:null, stc:null, lr:null};
/* Spot the Change */
function newStc(T){
  const idx = Math.floor(Math.random() * T.length), t = T[idx];
  const words = t.text.split(/\s+/);
  const swaps = ['always','never','some','every','all','no','must','should','can','may','only','also','first','last','new','old','each','many','few','any'];
  let ci; do { ci = Math.floor(Math.random() * words.length); } while (words[ci].length < 2);
  const orig = words[ci]; let fake;
  do { fake = swaps[Math.floor(Math.random() * swaps.length)]; } while (fake.toLowerCase() === orig.toLowerCase());
  if (orig[0] === orig[0].toUpperCase()) fake = fake[0].toUpperCase() + fake.slice(1);
  const shown = words.slice(); shown[ci] = fake;
  PR.stc = {t, words, shown, ci, orig, fake, pick:null, hinted:false};
}
/* Lightning Round */
function newLr(T){
  const qs = []; const order = shuffle(T.map((x,i)=>i));
  order.forEach((ti,qi) => {
    if (Math.random() < 0.5) { qs.push({trad:T[ti].name, text:T[ti].text, correct:true}); }
    else { let other; do { other = Math.floor(Math.random()*T.length); } while (other===ti);
      qs.push({trad:T[ti].name, text:T[other].text, correct:false}); }
  });
  PR.lr = {qs, qi:0, score:0, answers:[], pick:null, start:Date.now(), done:false};
}
function newMatch(T){ PR.mt = {order:shuffle(T.map((x, i) => i)), q:0, score:0, start:Date.now(), pick:null, done:false}; }
const mmss = s => Math.floor(s / 60) + ':' + pad(s % 60);
function prFlip(T){
  if (!PR.deck || PR.deck.length !== T.length) PR.deck = T.map((x, i) => i);
  const t = T[PR.deck[PR.i]];
  return '<p class="group-note">Say the Tradition out loud, then tap the card to check yourself.</p>' +
    '<button type="button" class="fc' + (PR.flip ? ' on' : '') + '" data-pr="flip" aria-live="polite"><span class="fc-k">' + (PR.flip ? esc(t.name) : 'Tap to check') + '</span><span class="fc-t">' + esc(PR.flip ? t.text : t.name) + '</span></button>' +
    '<div class="pr-nav"><button type="button" class="btn" data-pr="prev">Back</button><span>' + (PR.i + 1) + ' of ' + T.length + '</span><button type="button" class="btn call" data-pr="next">Next</button></div>' +
    '<button type="button" class="pr-link" data-pr="shuffle">Shuffle the Cards</button>';
}
function prStc(T){
  if (!PR.stc) newStc(T);
  const c = PR.stc, done = c.pick != null;
  const whtml = c.shown.map((w, i) => {
    let cls = 'stc-w';
    if (done && i === c.ci) cls += ' right';
    else if (done && i === c.pick && c.pick !== c.ci) cls += ' pick';
    else if (!done && c.hinted && i === c.ci) cls += ' hint';
    return '<button type="button" class="' + cls + '" data-pr="stcpick" data-k="' + i + '"' + (done ? ' disabled' : '') + '>' + esc(w) + '</button>';
  }).join(' ');
  const msg = done ? (c.pick === c.ci ? '<p class="pr-ok">Nice eye! "' + esc(c.fake) + '" should be "' + esc(c.orig) + '".</p>' : '<p class="pr-no">The changed word was "' + esc(c.fake) + '" — it should be "' + esc(c.orig) + '".</p>') : '';
  return '<div class="block"><div class="pr-k">' + esc(c.t.name) + '</div><p class="pr-hint">One word has been changed. Find it.</p><p class="stc-line">' + whtml + '</p>' + msg + '</div>' +
    '<div class="pr-nav">' + (done ? '' : '<button type="button" class="btn" data-pr="stchint">Hint</button>') + '<button type="button" class="btn call" data-pr="newstc">' + (done ? 'Next One' : 'Skip') + '</button></div>';
}
function prLr(T){
  if (!PR.lr) newLr(T);
  const m = PR.lr;
  if (m.done){
    const secs = Math.round((m.end - m.start) / 1000);
    return '<div class="block pr-done"><div class="pr-k">Lightning Round Complete</div><div class="pr-big">' + m.score + ' of ' + m.qs.length + '</div><p>Time: ' + mmss(secs) + '</p>' +
      '<div class="lr-streak">' + m.answers.map(a => '<span class="lr-dot ' + (a ? 'right' : 'wrong') + '"></span>').join('') + '</div></div>' +
      '<button type="button" class="btn call big" data-pr="newlr">Play Again</button>';
  }
  const q = m.qs[m.qi], done = m.pick != null;
  const yc = done ? (m.pick === 'yes' ? (q.correct ? ' pick-right' : ' pick-wrong') : '') : ' yes';
  const nc = done ? (m.pick === 'no' ? (!q.correct ? ' pick-right' : ' pick-wrong') : '') : ' no';
  return '<p class="pr-prog">Question ' + (m.qi + 1) + ' of ' + m.qs.length + ' · Score ' + m.score + '</p>' +
    '<div class="block"><div class="pr-k">' + esc(q.trad) + '</div><p class="lr-text">"' + esc(q.text) + '"</p></div>' +
    '<p class="pr-hint" style="text-align:center">Does this text match the Tradition shown above?</p>' +
    '<div class="lr-btns"><button type="button" class="' + yc + '" data-pr="lryes"' + (done ? ' disabled' : '') + '>Yes</button><button type="button" class="' + nc + '" data-pr="lrno"' + (done ? ' disabled' : '') + '>No</button></div>' +
    (done ? '<div class="pr-nav"><span class="' + (((m.pick==='yes') === q.correct) ? 'pr-ok">Right!' : 'pr-no">Nope — that\'s actually ' + esc(q.correct ? 'a match' : 'a different Tradition') + '.') + '</span><button type="button" class="btn call" data-pr="lrnext">' + (m.qi + 1 < m.qs.length ? 'Next' : 'See Score') + '</button></div>' : '') +
    '<div class="lr-streak">' + m.answers.map(a => '<span class="lr-dot ' + (a ? 'right' : 'wrong') + '"></span>').join('') + '</div>';
}
function prMatch(T){
  if (!PR.mt) newMatch(T);
  const m = PR.mt;
  if (m.done){
    const secs = Math.round((m.end - m.start) / 1000);
    let best = null; try { best = JSON.parse(localStorage.getItem('ohub.match.best') || 'null'); } catch (e) {}
    return '<div class="block pr-done"><div class="pr-k">Round Complete</div><div class="pr-big">' + m.score + ' of ' + T.length + '</div><p>Time: ' + mmss(secs) + '</p>' +
      (best ? '<p class="pr-hint">Your best: ' + best.score + ' of ' + T.length + ' in ' + mmss(best.secs) + '</p>' : '') + '</div>' +
      '<button type="button" class="btn call big" data-pr="newmt">Play Again</button>';
  }
  const ans = m.order[m.q], t = T[ans];
  return '<p class="pr-prog">Question ' + (m.q + 1) + ' of ' + T.length + ' · Score ' + m.score + '</p>' +
    '<div class="block"><div class="pr-k">Which Tradition is this?</div><p class="pr-q">' + esc(t.text) + '</p></div>' +
    '<div class="mt-grid">' + T.map((x, i) => '<button type="button" class="mt' + (m.pick != null ? (i === ans ? ' right' : i === m.pick ? ' wrong' : '') : '') + '" data-pr="ans" data-k="' + i + '"' + (m.pick != null ? ' disabled' : '') + ' aria-label="Tradition ' + (i + 1) + '">' + (i + 1) + '</button>').join('') + '</div>' +
    (m.pick != null ? '<div class="pr-nav"><span class="' + (m.pick === ans ? 'pr-ok">Right!' : 'pr-no">That one is ' + esc(t.name) + '.') + '</span><button type="button" class="btn call" data-pr="nextq">' + (m.q + 1 < T.length ? 'Next' : 'See Score') + '</button></div>' : '');
}
function prBody(){
  const T = tradList(); if (!T.length) return empty('The Traditions are still loading.');
  const tabs = [['flip','Flip Cards'],['match','Match'],['spot','Spot'],['lightning','Lightning']];
  return '<div class="pr-tabs" role="tablist" style="grid-template-columns:repeat(4,1fr)">' + tabs.map(([k, l]) => '<button type="button" role="tab" aria-selected="' + (PR.mode === k) + '" class="pr-tab' + (PR.mode === k ? ' on' : '') + '" data-pr="mode" data-k="' + k + '" style="font-size:14px">' + l + '</button>').join('') + '</div>' +
    (PR.mode === 'flip' ? prFlip(T) : PR.mode === 'match' ? prMatch(T) : PR.mode === 'spot' ? prStc(T) : prLr(T)) +
    '<p class="pr-foot">Good luck and have fun — you\'ll know all nine by heart in no time.</p>';
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-pr]'); if (!b) return;
  const T = tradList(), a = b.dataset.pr, k = b.dataset.k, n = T.length;
  if (a === 'mode'){ PR.mode = k; }
  else if (a === 'flip'){ PR.flip = !PR.flip; }
  else if (a === 'next'){ PR.i = (PR.i + 1) % n; PR.flip = false; }
  else if (a === 'prev'){ PR.i = (PR.i + n - 1) % n; PR.flip = false; }
  else if (a === 'shuffle'){ PR.deck = shuffle(T.map((x, i) => i)); PR.i = 0; PR.flip = false; }
  else if (a === 'stcpick'){ const c = PR.stc; if (c.pick != null) return; c.pick = +k; }
  else if (a === 'stchint'){ const c = PR.stc; c.hinted = true; }
  else if (a === 'newstc'){ newStc(T); }
  else if (a === 'lryes' || a === 'lrno'){ const m = PR.lr; if (m.pick != null) return; m.pick = a === 'lryes' ? 'yes' : 'no'; const right = (m.pick === 'yes') === m.qs[m.qi].correct; if (right) m.score++; m.answers.push(right); }
  else if (a === 'lrnext'){ const m = PR.lr; m.pick = null; m.qi++; if (m.qi >= m.qs.length){ m.done = true; m.end = Date.now(); } }
  else if (a === 'newlr'){ newLr(T); }
  else if (a === 'ans'){ const m = PR.mt; if (m.pick != null) return; m.pick = +k; if (+k === m.order[m.q]) m.score++; }
  else if (a === 'nextq'){
    const m = PR.mt; m.pick = null; m.q++;
    if (m.q >= n){
      m.done = true; m.end = Date.now();
      const secs = Math.round((m.end - m.start) / 1000);
      try { const best = JSON.parse(localStorage.getItem('ohub.match.best') || 'null'); if (!best || m.score > best.score || (m.score === best.score && secs < best.secs)) localStorage.setItem('ohub.match.best', JSON.stringify({score:m.score, secs})); } catch (e) {}
    }
  }
  else if (a === 'newmt'){ newMatch(T); }
  const el = document.getElementById('pr'); if (el) el.innerHTML = prBody();
});

/* ---------- HSC visit round: first Monday to first Monday ---------- */
function hscRound(now){
  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let end = nthDay(t0.getFullYear(), t0.getMonth(), 1, 1);
  if (end <= t0) end = nthDay(t0.getFullYear(), t0.getMonth() + 1, 1, 1);
  const start = nthDay(end.getFullYear(), end.getMonth() - 1, 1, 1);
  const total = Math.round((end - start) / 86400000), left = Math.round((end - t0) / 86400000);
  return {start, end, total, left};
}
function ring(r){
  const C = 2 * Math.PI * 36, frac = Math.max(0, Math.min(1, (r.total - r.left) / r.total));
  return '<div class="ring" role="img" aria-label="' + r.left + ' days left in this round"><svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="36" fill="none" stroke="var(--line)" stroke-width="8"/>' +
    '<circle cx="42" cy="42" r="36" fill="none" stroke="var(--gold)" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + (C * frac).toFixed(1) + ' ' + C.toFixed(1) + '"/></svg>' +
    '<b>' + r.left + '<small>' + (r.left === 1 ? 'DAY LEFT' : 'DAYS LEFT') + '</small></b></div>';
}
function hscCard(){
  const r = hscRound(new Date());
  const endTxt = r.end.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
  return '<a class="hsc hsc-c" href="#/hsc"><span class="clip">HSC TRACKER</span><div class="row"><div><div class="h">House Visits</div><div class="s">Round Ends ' + esc(endTxt) + '</div></div>' +
    ring(r) + '</div><span class="go">Log a Visit</span></a>';
}

/* ---------- data: saved copy first, then the Sheet ---------- */
async function loadData(){
  try { DATA = await (await fetch('../content.json', {cache:'no-cache'})).json(); STATUS.bundled = true; } catch (e) { DATA = {}; STATUS.bundled = false; }
  try { const c = JSON.parse(localStorage.getItem(KEY) || '{}'); Object.keys(c).forEach(t => { DATA[t] = c[t]; }); STATUS.saved = Object.keys(c).length; } catch (e) {}
  render();
  if (!LIVE){ STATUS.live = 'not set up'; return; }
  const saved = {}; let ok = 0; const before = JSON.stringify(DATA);
  await Promise.all(TABS.map(async t => {
    try {
      const url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&headers=1&sheet=' + encodeURIComponent(t);
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const objs = toObjects(parseCSV(await res.text()));
      DATA[t] = objs; saved[t] = objs; ok++;
    } catch (e) { STATUS['fail_' + t] = String(e.message || e); }
  }));
  STATUS.live = ok + ' of ' + TABS.length + ' tabs';
  if (ok){
    try { const prev = JSON.parse(localStorage.getItem(KEY) || '{}'); localStorage.setItem(KEY, JSON.stringify(Object.assign(prev, saved))); } catch (e) {}
    if (JSON.stringify(DATA) !== before) render();
  }
}

window.addEventListener('hashchange', onRoute);
loadData();
