<!DOCTYPE html>
<html lang="en">
<head>

<title>Oxford House Hub</title>
<meta name="theme-color" content="#26395C">
<meta name="description" content="Reference and announcements for Oxford House Chapter 2 and Chapter 9">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#101B2D; --panel:#18263D; --panel2:#22334F; --navy:#26395C; --ink:#F2F4F8; --muted:#A5B0C4;
  --gold:#F2C14E; --gold2:#E9A93A; --line:#2C3D5A; --dark:#1A1608;
  --alert:#E5484D; --alert-tint:#3A1820; --alert-line:#6B2A36;
  --teal:var(--gold); --white:var(--panel); --tint:var(--panel2);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; font-size:18px; line-height:1.5; padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--gold)}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px; border-radius:6px}
.wrap{max-width:640px; margin:0 auto; padding:0 16px 40px}
h1,h2,h3,.disp{font-family:'Archivo',sans-serif}

/* section top bar */
.bar{position:sticky; top:0; z-index:5; background:var(--navy); padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 18px; border-radius:0 0 24px 24px}
.bar-in{max-width:640px; margin:0 auto; display:flex; flex-direction:column; align-items:flex-start; gap:10px}
.back{display:inline-flex; align-items:center; gap:4px; min-height:44px; padding:0 14px 0 8px; background:rgba(255,255,255,.08); color:var(--gold); border-radius:14px; font-weight:700; font-size:17px; text-decoration:none}
.back svg{width:22px; height:22px}
.bar h1{margin:0; font-size:28px; line-height:1.1; font-weight:900; color:#fff}
.bar .kick{font-size:12px; letter-spacing:.14em; font-weight:700; color:var(--gold); text-transform:uppercase; font-family:'Archivo',sans-serif; margin-bottom:-6px}

/* hub header */
.hero{background:var(--navy); text-align:center; padding:calc(env(safe-area-inset-top,0px) + 26px) 16px 92px; border-radius:0 0 30px 30px}
.lg-a{font-family:'Archivo',sans-serif; font-weight:900; font-size:30px; letter-spacing:.06em; line-height:1; color:#fff}
.lg-b{display:flex; align-items:center; gap:12px; justify-content:center; margin-top:7px; color:var(--gold); font-family:'Archivo',sans-serif; font-weight:800; font-size:16px; letter-spacing:.5em; padding-left:.5em}
.lg-b:before,.lg-b:after{content:""; height:2px; width:60px; background:var(--gold)}
.chap{font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:10px; font-family:'Archivo',sans-serif}
.wh{font-family:'Kaushan Script',cursive; color:var(--gold); font-size:36px; line-height:1.1; margin-top:12px}
.meet{display:block; text-decoration:none; position:relative; margin:-70px 16px 0; border-radius:22px; padding:18px; background:linear-gradient(135deg,#F7CF5E,var(--gold2)); color:var(--dark); box-shadow:0 12px 28px rgba(0,0,0,.35)}
.meet small{font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:12px; font-family:'Archivo',sans-serif}
.meet .d{font-family:'Archivo',sans-serif; font-weight:900; font-size:42px; line-height:1; margin:4px 0 4px}
.meet .l{font-weight:700; font-size:17px; line-height:1.3}
.meet .w{font-size:14px; margin-top:2px}
.meet-go{display:block; color:inherit; text-decoration:none}
.cal-btns{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.cta{display:inline-flex; align-items:center; min-height:46px; border:0; cursor:pointer; font:inherit; background:var(--dark); color:#fff; border-radius:12px; padding:0 14px; font-weight:700; font-size:15px}
.hub-body{max-width:640px; margin:0 auto; padding:14px 16px 40px}
.tile{display:flex; text-decoration:none; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:20px}
.tile svg{flex:none; stroke:var(--gold)}
.tile .t{font-weight:700; line-height:1.2}
.tile .s{color:var(--muted); font-size:14px; line-height:1.3}
.wide{background:var(--panel2); padding:16px; gap:14px; align-items:center; min-height:78px}
.wide svg{width:32px; height:32px}
.wide .t{font-size:18px}
.hub-h{font-family:'Archivo',sans-serif; font-size:21px; font-weight:800; margin:24px 0 12px}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid .tile{flex-direction:column; justify-content:space-between; gap:12px; padding:16px; min-height:112px}
.grid .tile svg{width:30px; height:30px}
.grid .t{font-size:17px}
.mini{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.mini .tile{align-items:center; gap:10px; padding:12px 14px; min-height:58px; font-size:16px}
.mini .tile svg{width:22px; height:22px}

/* HSC tracker card on the front page */
.hsc{display:block; text-decoration:none; color:var(--ink); margin-top:12px}
.hsc .k{font-family:'Archivo',sans-serif; font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--gold)}
.hsc .h{font-family:'Archivo',sans-serif; font-size:21px; font-weight:900; line-height:1.15; margin-top:2px}
.hsc .s{color:var(--muted); font-size:14px; margin-top:2px}
.hsc .go{display:inline-flex; align-items:center; gap:6px; margin-top:12px; background:var(--gold); color:var(--dark); border-radius:12px; padding:10px 14px; font-weight:700; font-size:15px}
/* a: round countdown */
.hsc-a{background:var(--panel2); border:1px solid var(--line); border-radius:20px; padding:16px; display:flex; gap:16px; align-items:center}
.hsc-a .ring{flex:none; width:84px; height:84px; position:relative}
.hsc-a .ring svg{width:84px; height:84px; transform:rotate(-90deg)}
.hsc-a .ring b{position:absolute; inset:0; display:grid; place-items:center; text-align:center; font-family:'Archivo',sans-serif; font-weight:900; font-size:26px; line-height:1}
.hsc-a .ring b small{display:block; font-size:10px; letter-spacing:.08em; color:var(--muted); font-weight:700; margin-top:2px}
/* b: ticket stub */
.hsc-b{display:flex; border-radius:20px; overflow:hidden; position:relative}
.hsc-b .l{flex:1; background:var(--panel2); padding:16px}
.hsc-b .r{flex:none; width:96px; background:var(--gold); color:var(--dark); display:grid; place-items:center; text-align:center; font-family:'Archivo',sans-serif; font-weight:900; font-size:15px; line-height:1.15; border-left:3px dashed var(--bg)}
.hsc-b .r svg{width:30px; height:30px; stroke:var(--dark); display:block; margin:0 auto 6px}
.hsc-b:before,.hsc-b:after{content:""; position:absolute; right:84px; width:24px; height:24px; border-radius:50%; background:var(--bg)}
.hsc-b:before{top:-12px} .hsc-b:after{bottom:-12px}
/* c: clipboard */
.hsc-c{position:relative; background:linear-gradient(180deg,var(--panel2),var(--panel)); border:2px solid var(--gold); border-radius:20px; padding:26px 16px 16px; margin-top:24px}
.hsc-c .clip{position:absolute; top:-14px; left:50%; transform:translateX(-50%); background:var(--gold); color:var(--dark); border-radius:10px; padding:4px 14px; font-family:'Archivo',sans-serif; font-weight:900; font-size:12px; letter-spacing:.14em}
.hsc-c .row{display:flex; justify-content:space-between; align-items:flex-end; gap:12px}
.hsc-c .days{font-family:'Archivo',sans-serif; font-weight:900; font-size:40px; line-height:1; color:var(--gold); text-align:right}
.hsc-c .days small{display:block; font-size:11px; letter-spacing:.08em; color:var(--muted); font-weight:700}
.hsc-c .go{display:flex; justify-content:center}
.helpbar{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:14px; background:var(--alert-tint); border:1px solid var(--alert-line); border-radius:20px; padding:14px 16px; text-decoration:none; color:var(--ink)}
.helpbar b{font-size:17px}
.helpbar span{background:var(--alert); color:#fff; border-radius:12px; padding:10px 14px; font-weight:700; white-space:nowrap}
.install{font-size:14px; line-height:1.4; color:var(--muted); text-align:center; padding:24px 8px 0}
.install p{margin:0 0 4px}

/* cards */
.group-title{font-size:20px; font-weight:800; margin:26px 0 6px; line-height:1.2}
.group-note{margin:14px 0 10px; color:var(--muted); font-size:16px}
details.card{background:var(--panel); border:1px solid var(--line); border-radius:18px; margin-top:10px}
details.card summary{list-style:none; cursor:pointer; min-height:62px; padding:14px 16px; font-weight:700; font-size:18px; line-height:1.25; display:flex; align-items:center; justify-content:space-between; gap:12px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:""; flex:none; width:11px; height:11px; border-right:3px solid var(--gold); border-bottom:3px solid var(--gold); transform:rotate(45deg); margin-top:-4px; transition:transform .15s ease}
details.card[open] summary::after{transform:rotate(-135deg); margin-top:4px}
details.card[open]{border:2px solid var(--gold); background:var(--panel2)}
.cb{padding:2px 16px 16px}
.cb p{margin:0 0 12px}
.cb ul,.cb ol{margin:0 0 12px; padding-left:24px}
.cb li{margin-bottom:6px}
.cb li::marker{color:var(--gold)}
.cb p.quote{font-size:20px; line-height:1.45; border-left:4px solid var(--gold); padding-left:14px; color:#fff}
.meta{border-top:1px solid var(--line); margin-top:14px; padding-top:10px; color:var(--muted); font-size:13px; line-height:1.4}
.meta div+div{margin-top:2px}

.block{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:16px; margin-top:10px}
.block h3{margin:0 0 2px; font-size:19px; line-height:1.25}
.block .when{font-size:17px; margin:6px 0 0}
.block .where{color:var(--muted); font-size:16px; margin:4px 0 0}
.next-card{background:linear-gradient(135deg,#F7CF5E,var(--gold2)); border:0; color:var(--dark)}
.next-card .where,.next-card .when,.next-card .meta{color:#4A3A10!important}
.next-card .meta{border-color:rgba(0,0,0,.15)}
.next-card .date{font-family:'Archivo',sans-serif; font-size:28px; font-weight:900; line-height:1.1; margin:4px 0 0; color:var(--dark)}
.empty{background:transparent; border:2px dashed var(--line); border-radius:18px; padding:16px; margin-top:10px; color:var(--muted)}

.linkrow{display:block; text-decoration:none; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:14px 16px; margin-top:10px; min-height:60px}
.linkrow b{display:block; font-size:18px; color:var(--gold)}
.linkrow span{display:block; color:var(--muted); font-size:15px; line-height:1.4; margin-top:2px}
.res{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:14px 16px; margin-top:10px}
.res h3{margin:0; font-size:18px; line-height:1.25}
.res p{margin:4px 0 10px; color:var(--muted); font-size:15px; line-height:1.4}
.btns{display:flex; flex-wrap:wrap; gap:8px}
.btn{display:inline-flex; align-items:center; min-height:48px; padding:0 18px; border-radius:14px; font-weight:700; font-size:17px; text-decoration:none; border:2px solid var(--gold); color:var(--gold); background:transparent}
.btn.call{background:var(--gold); color:var(--dark)}
.badge{display:inline-block; margin-top:4px; padding:2px 10px; border-radius:99px; background:#3B3216; color:var(--gold); font-size:13px; font-weight:700}
.res.emergency{background:var(--alert-tint); border-color:var(--alert-line)}
.res.emergency .btn.call{background:var(--alert); border-color:var(--alert); color:#fff}
.res.emergency h3{color:#FF8A8E}

.search{width:100%; min-height:54px; font:inherit; font-size:18px; padding:0 16px; border:2px solid var(--line); border-radius:16px; background:var(--panel); color:var(--ink); margin-top:16px}
.search::placeholder{color:var(--muted)}
.term{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:12px 16px; margin-top:10px}
.term b{display:block; font-size:18px; color:var(--gold); font-family:'Archivo',sans-serif}
.term p{margin:2px 0 0}
.term .meta{margin-top:8px; padding-top:8px}
.house{display:flex; justify-content:space-between; gap:12px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:12px 16px; margin-top:10px}
.house b{font-size:18px; display:block}
.house span{color:var(--muted); font-size:15px}
.house .r{text-align:right; flex:none; max-width:45%}
.soon{text-align:center; padding:28px 16px; background:var(--panel); border:1px solid var(--line); border-radius:20px; margin-top:18px}
.soon svg{width:56px; height:56px; stroke:var(--gold)}
.soon h3{font-size:22px; margin:10px 0 4px}
.soon p{color:var(--muted); margin:0}
.btn.big{display:flex; justify-content:center; width:100%; min-height:58px; margin-top:18px; font-size:19px}
.mini .tile:last-child:nth-child(odd){grid-column:span 2}
.status{font-size:13px; color:var(--muted); text-align:center; margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:340px){.grid,.mini{grid-template-columns:1fr}}
</style>

<body>
<div id="app"></div>

<script>
/* ============ SETTINGS (the only thing to edit in this file) ============
   Paste the Sheet's ID between the quotes. It is the long code in the Sheet's web address:
   https://docs.google.com/spreadsheets/d/  THIS-PART  /edit
   Leave it as is and the app shows the content saved inside the app (content.json). */
const SHEET_ID = '1-vzKu8RlqYbu5tGH0kZD3__KnuM8W63xNfgxqmWLQTY';
/* ====================================================================== */

const TABS = ['Announcements','NewMember','Traditions','Positions','Meetings','ChapterCards','Glossary','FormsLinks','ChapterInfo','Houses','LocalResources'];
const LIVE = SHEET_ID && SHEET_ID !== 'PASTE_SHEET_ID_HERE';
const KEY = 'ohub.data.v1'; /* same saved copy as the main hub */
let DATA = {};
let STATUS = {};

/* ---------- small helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rows = t => (DATA[t] || []);
const val = (o, k) => (o && o[k] != null ? String(o[k]).trim() : '');
const num = v => { const n = parseFloat(v); return isNaN(n) ? 1e9 : n; };

function parseCSV(text){
  const out = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n'){ row.push(f); out.push(row); row = []; f = ''; }
    else if (c === '\r'){ /* skip */ }
    else f += c;
  }
  if (f.length || row.length){ row.push(f); out.push(row); }
  return out;
}
function toObjects(grid){
  if (!grid.length) return [];
  const h = grid[0].map(x => x.trim());
  return grid.slice(1).filter(r => r.some(x => x.trim() !== '')).map(r => {
    const o = {}; h.forEach((k, i) => { o[k] = r[i] != null ? r[i] : ''; }); return o;
  });
}

/* ---------- text body: paragraphs, bullets, numbered lists ---------- */
function body(text){
  const lines = String(text || '').split('\n');
  let html = '', para = [], list = null, items = [];
  const flushP = () => {
    if (para.length){
      const t = para.join(' ').trim();
      html += '<p' + (/^["\u201C]/.test(t) ? ' class="quote"' : '') + '>' + esc(t) + '</p>';
      para = [];
    }
  };
  const flushL = () => { if (list){ html += '<' + list + '>' + items.map(i => '<li>' + esc(i) + '</li>').join('') + '</' + list + '>'; list = null; items = []; } };
  for (const raw of lines){
    const ln = raw.trim();
    let m;
    if (!ln){ flushP(); flushL(); }
    else if ((m = /^[-\u2022]\s+(.*)$/.exec(ln))){ flushP(); if (list !== 'ul'){ flushL(); list = 'ul'; } items.push(m[1]); }
    else if ((m = /^\d+\.\s+(.*)$/.exec(ln))){ flushP(); if (list !== 'ol'){ flushL(); list = 'ol'; } items.push(m[1]); }
    else { flushL(); para.push(ln); }
  }
  flushP(); flushL();
  return html;
}
function meta(src, lr){
  if (!src && !lr) return '';
  return '<div class="meta">' + (src ? '<div>Source: ' + esc(src) + '</div>' : '') + (lr ? '<div>Last reviewed: ' + esc(lr) + '</div>' : '') + '</div>';
}
function card(title, bodyText, src, lr){
  return '<details class="card"><summary>' + esc(title) + '</summary><div class="cb">' + body(bodyText) + meta(src, lr) + '</div></details>';
}
function cards(tab, titleKey, bodyKey){
  return rows(tab).slice().sort((a, b) => num(a.Order) - num(b.Order))
    .map(r => card(val(r, titleKey), val(r, bodyKey), val(r, 'Source'), val(r, 'LastReviewed'))).join('');
}
const empty = msg => '<div class="empty">' + esc(msg) + '</div>';

/* ---------- dates: "First Monday", "Fourth Saturday" ---------- */
const DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const ORD = {first:1, second:2, third:3, fourth:4, fifth:5, last:-1};
function parseRule(t){
  const m = /\b(first|second|third|fourth|fifth|last)\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i.exec(t || '');
  return m ? {n: ORD[m[1].toLowerCase()], d: DAYS.indexOf(m[2].toLowerCase())} : null;
}
function nthDay(y, mo, n, d){
  if (n > 0){
    const first = new Date(y, mo, 1), off = (d - first.getDay() + 7) % 7;
    const dt = new Date(y, mo, 1 + off + (n - 1) * 7);
    return dt.getMonth() === mo ? dt : null;
  }
  const last = new Date(y, mo + 1, 0), off = (last.getDay() - d + 7) % 7;
  return new Date(y, mo, last.getDate() - off);
}
function nextDate(rule, from){
  const t = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  for (let i = 0; i < 14; i++){
    const dt = nthDay(t.getFullYear(), t.getMonth() + i, rule.n, rule.d);
    if (dt && dt >= t) return dt;
  }
  return null;
}
function dayLabel(dt, now){
  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((dt - t0) / 86400000);
  const base = dt.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
  return diff === 0 ? 'Today, ' + base : diff === 1 ? 'Tomorrow, ' + base : base;
}
function meetings(){
  const now = new Date();
  return rows('ChapterInfo').map(r => {
    const rule = parseRule(val(r, 'WhenText'));
    const dt = rule ? nextDate(rule, now) : null;
    const chapter = val(r, 'Chapter'), kind = val(r, 'Meeting');
    const title = /^interchapter$/i.test(chapter) ? kind : (chapter + ' ' + kind.toLowerCase()).trim();
    const when = val(r, 'WhenText'); const i = when.indexOf('. ');
    return {r, dt, title, times: i >= 0 ? when.slice(i + 2) : '', rule: i >= 0 ? when.slice(0, i) : when};
  }).sort((a, b) => (a.dt && b.dt) ? a.dt - b.dt : a.dt ? -1 : 1);
}

/* ---------- add to calendar (.ics file) ---------- */
const pad = n => String(n).padStart(2, '0');
function clock(t){
  const m = /(\d{1,2}):(\d{2})\s*([ap])\.?m/i.exec(t || ''); if (!m) return null;
  let h = parseInt(m[1], 10) % 12; if (m[3].toLowerCase() === 'p') h += 12;
  return h * 60 + parseInt(m[2], 10);
}
function icsStamp(dt, mins){ return dt.getFullYear() + pad(dt.getMonth() + 1) + pad(dt.getDate()) + 'T' + pad(Math.floor(mins / 60)) + pad(mins % 60) + '00'; }
const icsText = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
function addToCalendar(i){
  const m = meetings().filter(x => x.dt)[i]; if (!m) return;
  const start = clock(m.times), biz = clock((/business ([^,]+)/i.exec(m.times) || [])[1]);
  const end = biz != null ? biz + 60 : (start != null ? start + 120 : null);
  const now = new Date(), stamp = now.getUTCFullYear() + pad(now.getUTCMonth() + 1) + pad(now.getUTCDate()) + 'T' + pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + '00Z';
  const d = m.dt, day = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  const when = start != null
    ? ['DTSTART;TZID=America/Chicago:' + icsStamp(d, start), 'DTEND;TZID=America/Chicago:' + icsStamp(d, end)]
    : ['DTSTART;VALUE=DATE:' + day];
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Oxford House Hub//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VTIMEZONE','TZID:America/Chicago',

/* ---------- HSC visit round: first Monday to first Monday ---------- */
function hscRound(now){
  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let end = nthDay(t0.getFullYear(), t0.getMonth(), 1, 1);
  if (end <= t0) end = nthDay(t0.getFullYear(), t0.getMonth() + 1, 1, 1);
  const start = nthDay(end.getFullYear(), end.getMonth() - 1, 1, 1);
  const total = Math.round((end - start) / 86400000), left = Math.round((end - t0) / 86400000);
  return {start, end, total, left};
}
function hscCard(){
  const v = (/[?&]hsc=([abc])/.exec(location.search) || [])[1] || 'a';
  const r = hscRound(new Date());
  const endTxt = r.end.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
  const daysTxt = r.left === 1 ? '1 day' : r.left + ' days';
  if (v === 'b') return '<a class="hsc hsc-b" href="#/hsc"><div class="l"><div class="k">For HSC reps</div><div class="h">HSC Tracker</div><div class="s">This round ends ' + esc(endTxt) + ', ' + esc(daysTxt) + ' left</div></div>' +
    '<div class="r">' + svg('hsc') + 'Log a<br>visit</div></a>';
  if (v === 'c') return '<a class="hsc hsc-c" href="#/hsc"><span class="clip">HSC TRACKER</span><div class="row"><div><div class="h">House visits</div><div class="s">Round ends ' + esc(endTxt) + '</div></div>' +
    '<div class="days">' + r.left + '<small>DAYS LEFT</small></div></div><span class="go">Log a visit</span></a>';
  const C = 2 * Math.PI * 36, frac = Math.max(0, Math.min(1, (r.total - r.left) / r.total));
  return '<a class="hsc hsc-a" href="#/hsc"><div class="ring"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="36" fill="none" stroke="var(--line)" stroke-width="8"/>' +
    '<circle cx="42" cy="42" r="36" fill="none" stroke="var(--gold)" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + (C * frac).toFixed(1) + ' ' + C.toFixed(1) + '"/></svg>' +
    '<b>' + r.left + '<small>DAYS LEFT</small></b></div><div><div class="k">HSC Tracker</div><div class="h">House visits this round</div><div class="s">Round ends ' + esc(endTxt) + '</div><span class="go">Log a visit</span></div></a>';
}

/* ---------- data: saved copy first, then the Sheet ---------- */
async function loadData(){
  try { DATA = await (await fetch('../content.json', {cache:'no-cache'})).json(); STATUS.bundled = true; } catch (e) { DATA = {}; STATUS.bundled = false; }
  try { const c = JSON.parse(localStorage.getItem(KEY) || '{}'); Object.keys(c).forEach(t => { DATA[t] = c[t]; }); STATUS.saved = Object.keys(c).length; } catch (e) {}
  render();
  if (!LIVE){ STATUS.live = 'not set up'; return; }
  const saved = {}; let ok = 0; const before = JSON.stringify(DATA);
  await Promise.all(TABS.map(async t => {
    try {
      const url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&headers=1&sheet=' + encodeURIComponent(t);
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const objs = toObjects(parseCSV(await res.text()));
      DATA[t] = objs; saved[t] = objs; ok++;
    } catch (e) { STATUS['fail_' + t] = String(e.message || e); }
  }));
  STATUS.live = ok + ' of ' + TABS.length + ' tabs';
  if (ok){
    try { const prev = JSON.parse(localStorage.getItem(KEY) || '{}'); localStorage.setItem(KEY, JSON.stringify(Object.assign(prev, saved))); } catch (e) {}
    if (JSON.stringify(DATA) !== before) render();
  }
}

window.addEventListener('hashchange', onRoute);
loadData();
