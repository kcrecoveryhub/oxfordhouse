<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oxford House Hub</title>
<meta name="theme-color" content="#0F5C63">
<meta name="description" content="Reference and announcements for Oxford House Chapter 2 and Chapter 9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OH Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EF; --ink:#1B2A3A; --muted:#4A5868; --teal:#0F5C63; --tint:#E3EEEE;
  --line:#D9D4C7; --white:#FFFFFF; --alert:#8E2A2A; --alert-tint:#F6E4E1;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:18px; line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--teal); outline-offset:2px; border-radius:6px}
.wrap{max-width:640px; margin:0 auto; padding:0 16px 40px}

/* top bar on section screens */
.bar{
  position:sticky; top:0; z-index:5; background:var(--bg);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
  border-bottom:1px solid var(--line);
}
.bar-in{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:14px}
.back{
  display:inline-flex; align-items:center; gap:6px; min-height:52px; padding:0 18px 0 12px;
  background:var(--teal); color:#fff; border-radius:16px; font-weight:700; font-size:19px; text-decoration:none;
}
.back svg{width:22px; height:22px}
.bar h1{margin:0; font-size:22px; line-height:1.15}

/* hub */
.hub-head{padding:calc(env(safe-area-inset-top,0px) + 28px) 0 18px}
.hub-head h1{margin:0; font-size:30px; line-height:1.1}
.hub-head p{margin:6px 0 0; color:var(--muted); font-size:16px}
.tile{
  display:flex; text-decoration:none; color:var(--ink); background:var(--white);
  border:1.5px solid var(--line); border-radius:18px;
}
.tile svg{flex:none}
.tile .t{font-weight:700; line-height:1.15}
.tile .s{color:var(--muted); font-size:15px; line-height:1.3}
.banner{background:var(--teal); border-color:var(--teal); color:#fff; padding:20px; gap:16px; align-items:center; min-height:112px; border-radius:24px}
.banner .t{font-size:21px}
.banner .s{color:#D6E8E9; font-size:16px; margin-top:4px}
.banner .next{margin-top:8px; font-weight:700; font-size:17px}
.banner svg{width:44px; height:44px; stroke:#fff}
.wide{background:var(--tint); border-color:#C3DADB; padding:16px 18px; gap:14px; align-items:center; margin-top:12px; min-height:84px}
.wide svg{width:38px; height:38px; stroke:var(--teal)}
.wide .t{font-size:19px}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px}
.grid .tile{flex-direction:column; gap:12px; padding:16px; min-height:122px; justify-content:space-between}
.grid .tile svg{width:34px; height:34px; stroke:var(--teal)}
.grid .t{font-size:17px}
.install{font-size:14px; line-height:1.4; color:var(--muted); text-align:center; padding:22px 8px 0}
.install p{margin:0 0 4px}

/* cards */
.group-title{font-size:20px; margin:26px 0 4px; line-height:1.2}
.group-note{margin:0 0 10px; color:var(--muted); font-size:16px}
details.card{background:var(--white); border:1.5px solid var(--line); border-radius:16px; margin-top:10px}
details.card summary{
  list-style:none; cursor:pointer; min-height:60px; padding:14px 16px; font-weight:700; font-size:18px; line-height:1.25;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{
  content:""; flex:none; width:12px; height:12px; border-right:3px solid var(--teal); border-bottom:3px solid var(--teal);
  transform:rotate(45deg); margin-top:-4px; transition:transform .15s ease;
}
details.card[open] summary::after{transform:rotate(-135deg); margin-top:4px}
details.card[open]{border-color:var(--teal)}
.cb{padding:2px 16px 16px}
.cb p{margin:0 0 12px}
.cb ul,.cb ol{margin:0 0 12px; padding-left:24px}
.cb li{margin-bottom:6px}
.cb p.quote{border-left:4px solid var(--teal); padding-left:12px}
.meta{border-top:1px solid var(--line); margin-top:14px; padding-top:10px; color:var(--muted); font-size:15px; line-height:1.4}
.meta div+div{margin-top:2px}

/* plain blocks */
.block{background:var(--white); border:1.5px solid var(--line); border-radius:16px; padding:16px; margin-top:10px}
.block h3{margin:0 0 2px; font-size:19px; line-height:1.25}
.block .when{font-size:17px; margin:6px 0 0}
.block .where{color:var(--muted); font-size:16px; margin:4px 0 0}
.next-card{background:var(--tint); border-color:#C3DADB}
.next-card .date{font-size:24px; font-weight:700; line-height:1.15; margin:4px 0 0; color:var(--teal)}
.empty{background:var(--white); border:1.5px dashed var(--line); border-radius:16px; padding:16px; margin-top:10px; color:var(--muted)}

/* links and resources */
.linkrow{display:block; text-decoration:none; color:var(--ink); background:var(--white); border:1.5px solid var(--line); border-radius:16px; padding:14px 16px; margin-top:10px; min-height:60px}
.linkrow b{display:block; font-size:18px; color:var(--teal)}
.linkrow span{display:block; color:var(--muted); font-size:15px; line-height:1.4; margin-top:2px}
.res{background:var(--white); border:1.5px solid var(--line); border-radius:16px; padding:14px 16px; margin-top:10px}
.res h3{margin:0; font-size:18px; line-height:1.25}
.res p{margin:4px 0 10px; color:var(--muted); font-size:15px; line-height:1.4}
.btns{display:flex; flex-wrap:wrap; gap:8px}
.btn{display:inline-flex; align-items:center; min-height:48px; padding:0 18px; border-radius:14px; font-weight:700; font-size:17px; text-decoration:none; border:2px solid var(--teal); color:var(--teal); background:#fff}
.btn.call{background:var(--teal); color:#fff}
.badge{display:inline-block; margin-top:2px; padding:2px 10px; border-radius:99px; background:#FBEFD0; color:#5C4300; font-size:14px; font-weight:700}
.res.emergency{background:var(--alert-tint); border-color:#E2BDB8}
.res.emergency .btn.call{background:var(--alert); border-color:var(--alert)}
.res.emergency h3{color:var(--alert)}

/* glossary + houses */
.search{width:100%; min-height:54px; font:inherit; font-size:18px; padding:0 16px; border:1.5px solid var(--line); border-radius:16px; background:#fff; color:var(--ink); margin-top:6px}
.term{background:var(--white); border:1.5px solid var(--line); border-radius:16px; padding:12px 16px; margin-top:10px}
.term b{display:block; font-size:18px}
.term p{margin:2px 0 0}
.term .meta{margin-top:8px; padding-top:8px}
.house{display:flex; justify-content:space-between; gap:12px; background:var(--white); border:1.5px solid var(--line); border-radius:16px; padding:12px 16px; margin-top:10px}
.house b{font-size:18px; display:block}
.house span{color:var(--muted); font-size:15px}
.house .r{text-align:right; flex:none; max-width:45%}
.status{font-size:13px; color:var(--muted); text-align:center; margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:340px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ SETTINGS (the only thing to edit in this file) ============
   Paste the Sheet's ID between the quotes. It is the long code in the Sheet's web address:
   https://docs.google.com/spreadsheets/d/  THIS-PART  /edit
   Leave it as is and the app shows the content saved inside the app (content.json). */
const SHEET_ID = '1-vzKu8RlqYbu5tGH0kZD3__KnuM8W63xNfgxqmWLQTY';
/* ====================================================================== */

const TABS = ['Announcements','NewMember','Traditions','Positions','Meetings','ChapterCards','Glossary','FormsLinks','ChapterInfo','Houses','LocalResources'];
const LIVE = SHEET_ID && SHEET_ID !== 'PASTE_SHEET_ID_HERE';
const KEY = 'ohub.data.v1';
let DATA = {};
let STATUS = {};

/* ---------- small helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rows = t => (DATA[t] || []);
const val = (o, k) => (o && o[k] != null ? String(o[k]).trim() : '');
const num = v => { const n = parseFloat(v); return isNaN(n) ? 1e9 : n; };

function parseCSV(text){
  const out = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n'){ row.push(f); out.push(row); row = []; f = ''; }
    else if (c === '\r'){ /* skip */ }
    else f += c;
  }
  if (f.length || row.length){ row.push(f); out.push(row); }
  return out;
}
function toObjects(grid){
  if (!grid.length) return [];
  const h = grid[0].map(x => x.trim());
  return grid.slice(1).filter(r => r.some(x => x.trim() !== '')).map(r => {
    const o = {}; h.forEach((k, i) => { o[k] = r[i] != null ? r[i] : ''; }); return o;
  });
}

/* ---------- text body: paragraphs, bullets, numbered lists ---------- */
function body(text){
  const lines = String(text || '').split('\n');
  let html = '', para = [], list = null, items = [];
  const flushP = () => {
    if (para.length){
      const t = para.join(' ').trim();
      html += '<p' + (/^["\u201C]/.test(t) ? ' class="quote"' : '') + '>' + esc(t) + '</p>';
      para = [];
    }
  };
  const flushL = () => { if (list){ html += '<' + list + '>' + items.map(i => '<li>' + esc(i) + '</li>').join('') + '</' + list + '>'; list = null; items = []; } };
  for (const raw of lines){
    const ln = raw.trim();
    let m;
    if (!ln){ flushP(); flushL(); }
    else if ((m = /^[-\u2022]\s+(.*)$/.exec(ln))){ flushP(); if (list !== 'ul'){ flushL(); list = 'ul'; } items.push(m[1]); }
    else if ((m = /^\d+\.\s+(.*)$/.exec(ln))){ flushP(); if (list !== 'ol'){ flushL(); list = 'ol'; } items.push(m[1]); }
    else { flushL(); para.push(ln); }
  }
  flushP(); flushL();
  return html;
}
function meta(src, lr){
  if (!src && !lr) return '';
  return '<div class="meta">' + (src ? '<div>Source: ' + esc(src) + '</div>' : '') + (lr ? '<div>Last reviewed: ' + esc(lr) + '</div>' : '') + '</div>';
}
function card(title, bodyText, src, lr){
  return '<details class="card"><summary>' + esc(title) + '</summary><div class="cb">' + body(bodyText) + meta(src, lr) + '</div></details>';
}
function cards(tab, titleKey, bodyKey){
  return rows(tab).slice().sort((a, b) => num(a.Order) - num(b.Order))
    .map(r => card(val(r, titleKey), val(r, bodyKey), val(r, 'Source'), val(r, 'LastReviewed'))).join('');
}
const empty = msg => '<div class="empty">' + esc(msg) + '</div>';

/* ---------- dates: "First Monday", "Fourth Saturday" ---------- */
const DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const ORD = {first:1, second:2, third:3, fourth:4, fifth:5, last:-1};
function parseRule(t){
  const m = /\b(first|second|third|fourth|fifth|last)\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i.exec(t || '');
  return m ? {n: ORD[m[1].toLowerCase()], d: DAYS.indexOf(m[2].toLowerCase())} : null;
}
function nthDay(y, mo, n, d){
  if (n > 0){
    const first = new Date(y, mo, 1), off = (d - first.getDay() + 7) % 7;
    const dt = new Date(y, mo, 1 + off + (n - 1) * 7);
    return dt.getMonth() === mo ? dt : null;
  }
  const last = new Date(y, mo + 1, 0), off = (last.getDay() - d + 7) % 7;
  return new Date(y, mo, last.getDate() - off);
}
function nextDate(rule, from){
  const t = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  for (let i = 0; i < 14; i++){
    const dt = nthDay(t.getFullYear(), t.getMonth() + i, rule.n, rule.d);
    if (dt && dt >= t) return dt;
  }
  return null;
}
function dayLabel(dt, now){
  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff = Math.round((dt - t0) / 86400000);
  const base = dt.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'});
  return diff === 0 ? 'Today, ' + base : diff === 1 ? 'Tomorrow, ' + base : base;
}
function meetings(){
  const now = new Date();
  return rows('ChapterInfo').map(r => {
    const rule = parseRule(val(r, 'WhenText'));
    const dt = rule ? nextDate(rule, now) : null;
    const chapter = val(r, 'Chapter'), kind = val(r, 'Meeting');
    const title = /^interchapter$/i.test(chapter) ? kind : (chapter + ' ' + kind.toLowerCase()).trim();
    const when = val(r, 'WhenText'); const i = when.indexOf('. ');
    return {r, dt, title, times: i >= 0 ? when.slice(i + 2) : '', rule: i >= 0 ? when.slice(0, i) : when};
  }).sort((a, b) => (a.dt && b.dt) ? a.dt - b.dt : a.dt ? -1 : 1);
}

/* ---------- icons ---------- */
const I = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  start:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  book:'<path d="M4 4h6a3 3 0 013 3v13a2 2 0 00-2-2H4z"/><path d="M20 4h-6a3 3 0 00-3 3v13a2 2 0 012-2h7z"/>',
  badge:'<rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M8 17c.5-2 2-3 4-3s3.500 1 4 3"/>',
  meeting:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 15h4"/>',
  glossary:'<path d="M4 19l5-14 5 14M6 14h6"/><path d="M16 9h4M18 9v10M16 19h4"/>',
  link:'<path d="M10 14a4 4 0 005.700 0l3-3a4 4 0 00-5.700-5.700l-1 1"/><path d="M14 10a4 4 0 00-5.700 0l-3 3a4 4 0 005.700 5.700l1-1"/>',
  chapter:'<path d="M12 21s7-6.200 7-11a7 7 0 10-14 0c0 4.800 7 11 7 11z"/><circle cx="12" cy="10" r="2.500"/>',
  houses:'<path d="M2 12l5-4 5 4"/><path d="M3.500 11v9h7v-9"/><path d="M12 11l5-4 5 4"/><path d="M13.500 10v10h7v-9"/>',
  phone:'<path d="M5 4h4l2 5-2.500 1.500a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>',
  back:'<path d="M15 5l-7 7 7 7"/>'
};
const svg = (k, extra) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ' + (extra || '') + '>' + I[k] + '</svg>';

/* ---------- screens ---------- */
const SCREENS = {
  home: {title:'Home / Announcements', render(){
    const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const news = rows('Announcements').map(r => {
      const d = Date.parse(val(r, 'Date')), e = Date.parse(val(r, 'Expires'));
      return {r, d: isNaN(d) ? 0 : d, e: isNaN(e) ? null : e};
    }).filter(a => a.e === null || a.e >= today.getTime()).sort((a, b) => b.d - a.d);
    let h = '';
    if (news.length){
      h += '<h2 class="group-title">Announcements</h2>';
      h += news.map(a => '<div class="block"><h3>' + esc(val(a.r, 'Title')) + '</h3>' +
        (a.d ? '<div class="where">' + esc(new Date(a.d).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'})) + '</div>' : '') +
        body(val(a.r, 'Details')) + '</div>').join('');
    } else {
      h += '<h2 class="group-title">Announcements</h2>' + empty('No announcements right now. New ones will show up here.');
    }
    h += '<h2 class="group-title">Next meetings</h2>';
    const ms = meetings();
    h += ms.length ? ms.map(m => '<div class="block next-card"><h3>' + esc(m.title) + '</h3>' +
      (m.dt ? '<div class="date">' + esc(dayLabel(m.dt, now)) + '</div>' : '') +
      '<div class="when">' + esc(m.times || m.rule) + '</div>' +
      '<div class="where">' + esc(val(m.r, 'Where')) + '</div>' +
      '<div class="when" style="font-size:15px;color:var(--muted)">Usually: ' + esc(m.rule.charAt(0).toLowerCase() + m.rule.slice(1)) + '</div>' +
      meta(val(m.r, 'Source'), val(m.r, 'LastReviewed')) + '</div>').join('') : empty('Meeting times are not available yet.');
    return h;
  }},
  new: {title:'New Member Start Here', render(){
    return '<p class="group-note">Tap a card to open it.</p>' + (rows('NewMember').length ? cards('NewMember', 'Card', 'Body') : empty('Nothing here yet.'));
  }},
  traditions: {title:'Traditions & Principles', render(){
    const all = rows('Traditions').slice().sort((a, b) => num(a.Order) - num(b.Order));
    const t = all.filter(r => /^Tradition /i.test(val(r, 'Card'))), o = all.filter(r => !/^Tradition /i.test(val(r, 'Card')));
    const f = r => card(val(r, 'Card'), val(r, 'Body'), val(r, 'Source'), val(r, 'LastReviewed'));
    return (t.length ? '<h2 class="group-title">The nine Traditions</h2>' + t.map(f).join('') : '') +
      (o.length ? '<h2 class="group-title">Principles and stages</h2>' + o.map(f).join('') : '') || empty('Nothing here yet.');
  }},
  positions: {title:'Positions', render(){
    const all = rows('Positions').slice().sort((a, b) => num(a.Order) - num(b.Order));
    const groups = [['House officer','House officers','Every house elects these. Terms are six months.'], ['Chapter officer','Chapter officers','Chapters elect these once a year.'], ['Chapter committee','Chapter committees','Committees that serve the whole chapter.']];
    let h = '';
    groups.forEach(([k, t, note]) => {
      const rs = all.filter(r => val(r, 'Level') === k);
      if (rs.length) h += '<h2 class="group-title">' + t + '</h2><p class="group-note">' + note + '</p>' + rs.map(r => card(val(r, 'Position'), val(r, 'Duties'), val(r, 'Source'), val(r, 'LastReviewed'))).join('');
    });
    return h || empty('Nothing here yet.');
  }},
  meetings: {title:'Running a House Meeting', render(){
    return '<p class="group-note">Tap a card to open it.</p>' + (rows('Meetings').length ? cards('Meetings', 'Card', 'Body') : empty('Nothing here yet.'));
  }},
  glossary: {title:'Glossary', render(){
    return '<input class="search" id="gq" type="search" placeholder="Search a word" aria-label="Search the glossary" autocomplete="off"><div id="gl"></div>';
  }, after(){
    const all = rows('Glossary').slice().sort((a, b) => val(a, 'Term').toLowerCase().localeCompare(val(b, 'Term').toLowerCase()));
    const gl = document.getElementById('gl'), q = document.getElementById('gq');
    const draw = () => {
      const s = q.value.trim().toLowerCase();
      const hit = all.filter(r => !s || val(r, 'Term').toLowerCase().includes(s) || val(r, 'Meaning').toLowerCase().includes(s));
      gl.innerHTML = hit.length ? hit.map(r => '<div class="term"><b>' + esc(val(r, 'Term')) + '</b><p>' + esc(val(r, 'Meaning')) + '</p>' + meta(val(r, 'Source'), val(r, 'LastReviewed')) + '</div>').join('') : empty('No match. Try a shorter word.');
    };
    q.addEventListener('input', draw); draw();
  }},
  forms: {title:'Forms & Links', render(){
    const rs = rows('FormsLinks').filter(r => val(r, 'URL')).sort((a, b) => num(a.Order) - num(b.Order));
    return '<p class="group-note">These open the official sources. Forms are not copied here.</p>' + (rs.length ? rs.map(r => {
      const u = val(r, 'URL'), ext = /^https?:/i.test(u);
      return '<a class="linkrow" href="' + esc(u) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '><b>' + esc(val(r, 'Label')) + '</b>' + (val(r, 'Note') ? '<span>' + esc(val(r, 'Note')) + '</span>' : '') + '</a>';
    }).join('') : empty('Nothing here yet.'));
  }},
  chapter: {title:'Chapter Info', render(){
    const ms = rows('ChapterInfo');
    let h = '<h2 class="group-title">When and where</h2>';
    h += ms.length ? ms.map(r => '<div class="block"><h3>' + esc(/^interchapter$/i.test(val(r, 'Chapter')) ? val(r, 'Meeting') : val(r, 'Chapter') + ' ' + val(r, 'Meeting').toLowerCase()) + '</h3>' +
      (val(r, 'Counties') ? '<div class="where">' + esc(val(r, 'Counties')) + '</div>' : '') +
      '<div class="when">' + esc(val(r, 'WhenText')) + '</div><div class="where">' + esc(val(r, 'Where')) + '</div>' + meta(val(r, 'Source'), val(r, 'LastReviewed')) + '</div>').join('') : empty('Nothing here yet.');
    if (rows('ChapterCards').length) h += '<h2 class="group-title">How chapters work</h2>' + cards('ChapterCards', 'Card', 'Body');
    return h;
  }},
  houses: {title:'Houses', render(){
    const inactive = /^(no|false|n|inactive|0)$/i;
    const hs = rows('Houses').filter(r => val(r, 'House') && !inactive.test(val(r, 'Active')));
    if (!hs.length) return empty('The house list is not available right now. Check back soon.');
    const by = {};
    hs.forEach(r => { let c = val(r, 'Chapter'); c = /^\d+$/.test(c) ? 'Chapter ' + c : (c || 'Other'); (by[c] = by[c] || []).push(r); });
    return Object.keys(by).sort((a, b) => a.localeCompare(b, undefined, {numeric:true})).map(c =>
      '<h2 class="group-title">' + esc(c) + '</h2>' + by[c].sort((a, b) => val(a, 'House').localeCompare(val(b, 'House'))).map(r => {
        const mt = [val(r, 'MeetingDay'), val(r, 'MeetingTime')].filter(Boolean).join(', ');
        return '<div class="house"><div><b>' + esc(val(r, 'House')) + '</b><span>' + esc(val(r, 'City')) + '</span></div>' + (mt ? '<div class="r"><span>House meeting<br>' + esc(mt) + '</span></div>' : '') + '</div>';
      }).join('')).join('');
  }},
  local: {title:'Local Resources', render(){
    const rs = rows('LocalResources').slice().sort((a, b) => num(a.Order) - num(b.Order));
    if (!rs.length) return empty('Nothing here yet.');
    const order = []; rs.forEach(r => { if (!order.includes(val(r, 'Category'))) order.push(val(r, 'Category')); });
    return order.map(cat => {
      const items = rs.filter(r => val(r, 'Category') === cat);
      const em = /^emergency$/i.test(cat);
      return (em ? '' : '<h2 class="group-title">' + esc(cat) + '</h2>') + items.map(r => {
        const ph = val(r, 'Phone'), digits = ph.replace(/\D/g, ''), link = val(r, 'Link');
        const ver = /^(yes|y|true)$/i.test(val(r, 'VerifyFirst'));
        return '<div class="res' + (em ? ' emergency' : '') + '"><h3>' + esc(val(r, 'Name')) + '</h3>' +
          (ver ? '<span class="badge">Call to confirm first</span>' : '') +
          (val(r, 'Note') ? '<p>' + esc(val(r, 'Note')) + '</p>' : '') +
          '<div class="btns">' + (digits ? '<a class="btn call" href="tel:' + digits + '">Call ' + esc(ph) + '</a>' : '') +
          (link ? '<a class="btn" href="' + esc(link) + '" target="_blank" rel="noopener">Open website</a>' : '') + '</div>' +
          meta('', val(r, 'LastReviewed') ? val(r, 'LastReviewed') : '') + '</div>';
      }).join('');
    }).join('');
  }}
};

/* ---------- hub ---------- */
function hub(){
  const m = meetings().find(x => x.dt);
  const nextLine = m ? 'Next: ' + m.title + ', ' + m.dt.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'}) : 'Meeting schedule and news';
  const g = [['traditions','Traditions & Principles'],['positions','Positions'],['meetings','Running a House Meeting'],['glossary','Glossary'],['forms','Forms & Links'],['chapter','Chapter Info'],['houses','Houses'],['local','Local Resources']];
  return '<div class="wrap">' +
    '<header class="hub-head"><h1>Oxford House Hub</h1><p>Chapter 2 and Chapter 9, Kansas City area</p></header>' +
    '<a class="tile banner" href="#/home">' + svg('home') + '<span><span class="t">Home / Announcements</span><br><span class="s">' + 'Meeting schedule and news' + '</span>' + (m ? '<div class="next">' + esc(nextLine) + '</div>' : '') + '</span></a>' +
    '<a class="tile wide" href="#/new">' + svg('start') + '<span><span class="t">New Member Start Here</span><br><span class="s">Your first week or month</span></span></a>' +
    '<div class="grid">' + g.map(([k, l]) => '<a class="tile" href="#/' + k + '">' + svg(SCREENS[k].icon) + '<span class="t">' + esc(l) + '</span></a>').join('') + '</div>' +
    '<div class="install"><p>Add this to your home screen to open it like an app.</p><p>iPhone: tap Share, then Add to Home Screen. Android: tap the menu, then Install app or Add to Home screen.</p></div>' +
    (location.search.includes('debug') ? '<div class="status">' + esc(JSON.stringify(STATUS)) + '</div>' : '') +
    '</div>';
}
SCREENS.traditions.icon = 'book'; SCREENS.positions.icon = 'badge'; SCREENS.meetings.icon = 'meeting'; SCREENS.glossary.icon = 'glossary';
SCREENS.forms.icon = 'link'; SCREENS.chapter.icon = 'chapter'; SCREENS.houses.icon = 'houses'; SCREENS.local.icon = 'phone';

function render(){
  const key = (location.hash || '#/').replace(/^#\/?/, '');
  const app = document.getElementById('app');
  const s = SCREENS[key];
  if (!s){ app.innerHTML = hub(); document.title = 'Oxford House Hub'; return; }
  app.innerHTML = '<div class="bar"><div class="bar-in"><a class="back" href="#/">' + svg('back') + 'Hub</a><h1>' + esc(s.title) + '</h1></div></div>' +
    '<main class="wrap">' + s.render() + '</main>';
  document.title = s.title + ' - Oxford House Hub';
  if (s.after) s.after();
}
let lastKey = null;
function onRoute(){
  const k = location.hash;
  const same = k === lastKey; lastKey = k;
  render();
  if (!same) window.scrollTo(0, 0);
}

/* ---------- data: saved copy first, then the Sheet ---------- */
async function loadData(){
  try { DATA = await (await fetch('content.json', {cache:'no-cache'})).json(); STATUS.bundled = true; } catch (e) { DATA = {}; STATUS.bundled = false; }
  try { const c = JSON.parse(localStorage.getItem(KEY) || '{}'); Object.keys(c).forEach(t => { DATA[t] = c[t]; }); STATUS.saved = Object.keys(c).length; } catch (e) {}
  render();
  if (!LIVE){ STATUS.live = 'not set up'; return; }
  const saved = {}; let ok = 0; const before = JSON.stringify(DATA);
  await Promise.all(TABS.map(async t => {
    try {
      const url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv&headers=1&sheet=' + encodeURIComponent(t);
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const objs = toObjects(parseCSV(await res.text()));
      DATA[t] = objs; saved[t] = objs; ok++;
    } catch (e) { STATUS['fail_' + t] = String(e.message || e); }
  }));
  STATUS.live = ok + ' of ' + TABS.length + ' tabs';
  if (ok){
    try { const prev = JSON.parse(localStorage.getItem(KEY) || '{}'); localStorage.setItem(KEY, JSON.stringify(Object.assign(prev, saved))); } catch (e) {}
    if (JSON.stringify(DATA) !== before) render();
  }
}

window.addEventListener('hashchange', onRoute);
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
loadData();
</script>
